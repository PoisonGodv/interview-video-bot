<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面试充电站 · 操作台</title>
<style>
  :root { --bg:#0f172a; --bg2:#1e293b; --card:#16213a; --line:#334155;
          --accent:#38bdf8; --text:#e2e8f0; --dim:#94a3b8; --ok:#34d399; --err:#f87171; }
  * { box-sizing: border-box; margin: 0; }
  body { background: linear-gradient(135deg, var(--bg), var(--bg2)); color: var(--text);
         font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
         min-height: 100vh; padding: 24px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  header h1 { font-size: 22px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: #fbbf24; border-color: #fbbf24; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; margin-bottom: 14px; color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { background: #0b1226; color: var(--text); border: 1px solid var(--line);
          border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  button { background: var(--accent); color: #082f49; border: none; border-radius: 8px;
           padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .topic { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
           margin-top: 8px; cursor: pointer; }
  .topic:hover { border-color: var(--accent); }
  .topic b { color: var(--accent); }
  .topic p { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .stages { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .stage { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
  .stage.active { border-color: var(--accent); color: var(--accent); animation: pulse 1s infinite alternate; }
  .stage.done { border-color: var(--ok); color: var(--ok); }
  @keyframes pulse { to { background: rgba(56,189,248,.15); } }
  .proj { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .proj img { width: 200px; border-radius: 8px; flex-shrink: 0; }
  .proj .meta { flex: 1; min-width: 0; }
  .proj h3 { font-size: 15px; margin-bottom: 6px; }
  .proj .sub { color: var(--dim); font-size: 12px; }
  .detail { margin-top: 10px; display: none; }
  .detail.open { display: block; }
  video { width: 100%; max-width: 640px; border-radius: 10px; background: #000; }
  textarea { width: 100%; min-height: 110px; }
  textarea.code { min-height: 320px; font-family: Menlo, Consolas, monospace; font-size: 12px; }
  .proj .noimg { width: 200px; height: 112px; border-radius: 8px; flex-shrink: 0; border: 1px dashed var(--line);
                 display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; }
  .w100 { width: 100%; }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="brand">面试充电站 · 操作台</h1>
    <span class="badge" id="badge-llm">LLM …</span>
    <span class="badge" id="badge-tts">TTS …</span>
    <span class="badge" id="badge-upload">上传 …</span>
  </header>

  <div class="card">
    <h2>① 选题</h2>
    <div class="row">
      <input id="industry" value="互联网" placeholder="行业, 如 护理/汽修/教师">
      <input id="topic-n" type="number" value="8" min="1" max="20" style="width:70px">
      <button id="btn-topics">生成选题</button>
      <button class="ghost" id="btn-backlog">选题库</button>
      <span class="msg" id="topics-msg"></span>
    </div>
    <div id="topics"></div>
  </div>

  <div class="card">
    <h2>② 生成视频</h2>
    <div class="row">
      <input id="topic-title" placeholder="选题标题(点上面选题自动填入, 也可手填)" class="w100">
    </div>
    <div class="row" style="margin-top:10px">
      <select id="mode">
        <option value="single">单集短视频</option>
        <option value="series">系列长视频(多agent)</option>
      </select>
      <span id="series-opts" style="display:none">
        集数 <input id="episodes" type="number" value="3" min="1" max="12" style="width:64px">
        每集 <input id="duration" type="number" value="15" min="3" max="30" step="1" style="width:64px"> 分钟
      </span>
      <select id="aspect">
        <option value="16:9">横屏 16:9</option>
        <option value="9:16">竖屏 9:16</option>
      </select>
      <select id="provider"></select>
      <select id="voice"></select>
      <label class="msg" id="sample-wrap"><input type="checkbox" id="use-sample"> 用示例脚本(免 LLM 冒烟)</label>
      <label class="msg" id="script-only-wrap"><input type="checkbox" id="script-only"> 只生成脚本(审改后再生成视频)</label>
      <button id="btn-gen">开始生成</button>
      <button class="ghost" id="btn-cancel" style="display:none">取消任务</button>
    </div>
    <div class="msg" id="series-estimate" style="display:none"></div>
    <div class="msg" id="series-progress"></div>
    <div class="stages" id="stages" style="display:none"></div>
    <div class="msg" id="gen-msg"></div>
  </div>

  <div class="card">
    <h2>③ 作品库 <button class="ghost" id="btn-refresh" style="float:right">刷新</button></h2>
    <div id="series-resume"></div>
    <div id="projects"><p class="msg">加载中…</p></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
// 项目名 → 合法 DOM id 片段(中文/字母数字/-_ 原样, 其余转码)
const pid = (name) => encodeURIComponent(name).replace(/%/g, "_");
let voices = {}, pollTimer = null, currentJobId = null;
// 访问令牌(绑非回环地址时必需): 启动链接 #token=xxx → localStorage, 随后从地址栏抹掉;
// 再换一个 HttpOnly cookie, 让 <video>/<img>/日志链接这类带不了请求头的加载也能过鉴权
const tokenMatch = location.hash.match(/token=([^&]+)/);
if (tokenMatch) {
  localStorage.setItem("ivb-token", decodeURIComponent(tokenMatch[1]));
  history.replaceState(null, "", location.pathname + location.search);
}
const ivbToken = localStorage.getItem("ivb-token") || "";

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: {...(opts.body ? {"Content-Type": "application/json"} : {}),
              ...(ivbToken ? {"X-IVB-Token": ivbToken} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.detail || `HTTP ${r.status}`);
    err.status = r.status;
    err.jobId = data.job_id || null;  // 409: 正在跑的任务 id
    err.alreadyUploaded = !!data.already_uploaded;  // 409: 已有 bvid, 需确认后 force
    throw err;
  }
  return data;
}
const msg = (id, text, cls = "") => { const el = $(id); el.textContent = text; el.className = "msg " + cls; };

async function init() {
  if (ivbToken) await api("/api/session", {method: "POST"}).catch(() => {});
  let s;
  try { s = await api("/api/settings"); }
  catch (e) {
    msg("gen-msg", e.status === 401 ? "需要访问令牌: 请用启动时终端打印的带 #token= 的链接打开" : e.message, "err");
    return;
  }
  $("brand").textContent = s.brand + " · 操作台";
  const b = (id, ok, okText, noText) => {
    const el = $(id); el.textContent = ok ? okText : noText; el.className = "badge " + (ok ? "ok" : "warn");
  };
  b("badge-llm", s.llm_configured, "LLM 已配置", "LLM 未配置");
  b("badge-tts", s.tts_provider !== "doubao" || s.doubao_configured,
    "TTS: " + s.tts_provider, "豆包缺凭证");
  b("badge-upload", s.upload_enabled, "B站上传已开启", "上传未开启");
  if (s.video_aspect) $("aspect").value = s.video_aspect;
  voices = s.voices;
  $("provider").innerHTML = Object.keys(voices).map(p =>
    `<option value="${esc(p)}" ${p === s.tts_provider ? "selected" : ""}>${p === "edge" ? "edge-tts(免费)" : "豆包(火山)"}</option>`).join("");
  fillVoices();
  $("provider").onchange = fillVoices;
  loadProjects();
  const active = await api("/api/jobs/active").catch(() => null);
  if (active && active.status === "running") attachJob(active.id);
}
// 挂上已在跑的任务(页面刷新 / 409 冲突时)
function attachJob(id) {
  msg("gen-msg", "已有任务运行中, 已接上进度");
  $("btn-gen").disabled = true;
  pollJob(id);
}
function fillVoices() {
  const p = $("provider").value;
  $("voice").innerHTML = (voices[p] || []).map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
}

$("btn-topics").onclick = async () => {
  msg("topics-msg", "生成中…"); $("btn-topics").disabled = true;
  try {
    const d = await api("/api/topics", {method: "POST",
      body: {industry: $("industry").value, n: +$("topic-n").value}});
    showTopics(d.topics);
    msg("topics-msg", `${d.topics.length} 条选题(已入选题库), 点击填入生成框`, "ok");
  } catch (e) { msg("topics-msg", e.message, "err"); }
  $("btn-topics").disabled = false;
};
function showTopics(list) {
  $("topics").innerHTML = list.map(t =>
    `<div class="topic" data-t="${esc(t.title)}"><b>${esc(t.title)}</b><p>${esc(t.hook)}</p></div>`).join("");
  document.querySelectorAll(".topic").forEach(el =>
    el.onclick = () => { $("topic-title").value = el.dataset.t; });
}
$("btn-backlog").onclick = async () => {
  try {
    const d = await api("/api/topics/backlog?" + new URLSearchParams({industry: $("industry").value}));
    showTopics(d.topics);
    msg("topics-msg", `选题库未用 ${d.topics.length} 条(生成视频后自动标记已用)`, "ok");
  } catch (e) { msg("topics-msg", e.message, "err"); }
};

// 系列费用预估: 表单变化时刷新, 开始前再确认一次
async function fetchEstimate() {
  const q = new URLSearchParams({episodes: $("episodes").value,
    duration_min: $("duration").value, provider: $("provider").value});
  return api("/api/series/estimate?" + q);
}
async function refreshEstimate() {
  if ($("mode").value !== "series") { $("series-estimate").style.display = "none"; return null; }
  $("series-estimate").style.display = "block";
  try {
    const e = await fetchEstimate();
    $("series-estimate").innerHTML = "费用预估(粗估): " + e.lines.map(esc).join(" · ");
    $("series-estimate").className = "msg";
    return e;
  } catch (err) {
    $("series-estimate").textContent = err.message; $("series-estimate").className = "msg err";
    return null;
  }
}
["episodes", "duration", "provider"].forEach(id => $(id).addEventListener("change", refreshEstimate));

$("mode").onchange = () => {
  const series = $("mode").value === "series";
  refreshEstimate();
  $("series-opts").style.display = series ? "inline" : "none";
  $("sample-wrap").style.display = series ? "none" : "inline";
  $("script-only-wrap").style.display = series ? "none" : "inline";
  $("topic-title").placeholder = series
    ? "系列主题, 如「程序员面试通关」「护理转行指南」"
    : "选题标题(点上面选题自动填入, 也可手填)";
};

$("btn-gen").onclick = async () => {
  msg("gen-msg", ""); $("series-progress").textContent = ""; $("btn-gen").disabled = true;
  const series = $("mode").value === "series";
  try {
    if (series) {
      const e = await refreshEstimate();
      if (!e || !confirm("按以下预估开始生成系列?\n\n" + e.lines.join("\n"))) {
        $("btn-gen").disabled = false; return;
      }
    }
    const body = series ? {
      mode: "series", theme: $("topic-title").value || $("industry").value,
      industry: $("industry").value,
      episodes: +$("episodes").value, duration_min: +$("duration").value,
      provider: $("provider").value, voice: $("voice").value, aspect: $("aspect").value,
    } : {
      industry: $("industry").value, topic_title: $("topic-title").value || null,
      provider: $("provider").value, voice: $("voice").value,
      aspect: $("aspect").value, use_sample_script: $("use-sample").checked,
      stop_after: $("script-only").checked ? "script" : null,
    };
    const d = await api("/api/jobs", {method: "POST", body});
    pollJob(d.job_id);
  } catch (e) {
    if (e.jobId) { attachJob(e.jobId); return; }
    msg("gen-msg", e.message, "err"); $("btn-gen").disabled = false;
  }
};

async function pollJob(id) {
  currentJobId = id;
  $("stages").style.display = "flex";
  clearInterval(pollTimer);
  let netErrors = 0;
  const tick = async () => {
    try {
      const j = await api("/api/jobs/" + id);
      netErrors = 0;
      if (j.series) {
        const s = j.series;
        $("series-progress").textContent =
          `系列进度: 第 ${s.episode}/${s.episodes} 集 · ${s.phase}` +
          (s.chapters ? ` · 第 ${s.chapter}/${s.chapters} 章` : "");
      }
      $("stages").innerHTML = j.stages.map(s =>
        `<span class="stage ${s.done ? "done" : s.active ? "active" : ""}">${s.done ? "✓ " : ""}${esc(s.label)}</span>`).join("");
      $("btn-cancel").style.display = j.cancellable ? "inline-block" : "none";
      if (j.cancelling) msg("gen-msg", "正在取消, 等待 ffmpeg/浏览器进程退出…");
      if (j.status === "done") {
        clearInterval(pollTimer);
        const u = j.usage && j.usage.calls
          ? ` · LLM ${j.usage.calls} 次 / ${j.usage.total_tokens} tokens` : "";
        msg("gen-msg", j.stop_after === "script"
          ? `✅ 脚本已生成 → ${j.project}, 在作品库「详情/编辑」审改后点「保存并重新生成」${u}`
          : `✅ 完成 → ${j.project}${u}`, "ok");
        $("btn-gen").disabled = false; loadProjects();
      } else if (j.status === "failed" || j.status === "cancelled") {
        clearInterval(pollTimer);
        msg("gen-msg", (j.status === "cancelled" ? "⛔ " : "❌ ") + (j.error || j.status)
          + (j.series ? " · 可在作品库「未完成系列」点续跑" : ""), "err");
        if (j.error_log_url) {
          const a = document.createElement("a");
          a.href = j.error_log_url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " 查看错误日志";
          $("gen-msg").appendChild(a);
        }
        $("btn-gen").disabled = false; loadProjects();
      }
    } catch (e) {
      if (currentJobId !== id) return;
      if (e.status === 404) {
        clearInterval(pollTimer);
        $("btn-cancel").style.display = "none";
        msg("gen-msg", "服务已重启, 任务丢失(已完成的产物保留), 可在作品库里重新生成/续跑", "err");
        $("btn-gen").disabled = false; loadProjects();
      } else if (e.status === 401) {
        clearInterval(pollTimer);
        msg("gen-msg", e.message, "err"); $("btn-gen").disabled = false;
      } else if (++netErrors >= 5) {
        msg("gen-msg", `连不上服务(已连续失败 ${netErrors} 次: ${e.message}), 仍在重试…`, "err");
      }
    }
  };
  await tick();
  pollTimer = setInterval(tick, 1500);
}

$("btn-cancel").onclick = async () => {
  try {
    await api("/api/jobs/" + currentJobId + "/cancel", {method: "POST"});
    msg("gen-msg", "已请求取消, 等待任务停止…");
  } catch (e) { msg("gen-msg", e.message, "err"); }
};

// 重新生成/续跑默认沿用作品自己的配音与画幅, 勾选「覆盖设置」才用表单当前值
const overrideBody = (on) => on
  ? {provider: $("provider").value, voice: $("voice").value, aspect: $("aspect").value} : {};

async function loadSeries() {
  try {
    const d = await api("/api/series");
    const todo = d.series.filter(s => !s.complete);
    $("series-resume").innerHTML = todo.length ? '<p class="sub">未完成系列(已完成的集/章不重跑) '
      + '<label><input type="checkbox" id="override-series"> 覆盖设置: 用上方选的配音/音色/画幅</label></p>' +
      todo.map(s => `
      <div class="row" style="margin-top:6px" data-root="${esc(s.root)}">
        <span class="msg">《${esc(s.title)}》${esc(s.root)} · 已出片 ${esc(s.done_episodes)}/${esc(s.episodes)} 集</span>
        <button class="ghost" data-act="resume-series">续跑</button>
      </div>`).join("") : "";
  } catch (e) { $("series-resume").innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}

$("series-resume").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act=resume-series]");
  if (!btn) return;
  const root = btn.closest("[data-root]").dataset.root;
  btn.disabled = true;
  try {
    const d = await api(`/api/series/${encodeURIComponent(root)}/resume`, {method: "POST",
      body: overrideBody($("override-series").checked)});
    msg("gen-msg", `续跑系列 ${root}…`); $("series-progress").textContent = "";
    $("btn-gen").disabled = true;
    pollJob(d.job_id);
  } catch (e) {
    if (e.jobId) attachJob(e.jobId); else alert("续跑失败: " + e.message);
  }
  btn.disabled = false;
});

async function loadProjects() {
  loadSeries();
  try {
    const d = await api("/api/projects");
    if (!d.projects.length) { $("projects").innerHTML = '<p class="msg">暂无作品</p>'; return; }
    $("projects").innerHTML = d.projects.map(p => `
      <div class="proj" data-name="${esc(p.name)}">
        ${p.cover_url ? `<img src="${esc(p.cover_url)}" loading="lazy">`
          : `<div class="noimg">${p.status === "broken" ? "文件损坏" : p.status === "failed" ? "生成失败" : "仅脚本(未出片)"}</div>`}
        <div class="meta">
          <h3>${esc(p.title)}</h3>
          <div class="sub">${esc(p.name)} · ${esc(p.duration)}s · ${esc(p.industry)}
            ${p.bvid ? ` · <a href="https://www.bilibili.com/video/${encodeURIComponent(p.bvid)}" target="_blank" rel="noopener">${esc(p.bvid)}</a>` : ""}</div>
          ${p.error ? `<div class="msg err">${esc(p.error)}</div>` : ""}
          ${p.error_log_url ? `<div class="sub"><a href="${esc(p.error_log_url)}" target="_blank" rel="noopener">查看错误日志</a></div>` : ""}
          <div class="row" style="margin-top:8px">
            ${p.has_script ? '<button class="ghost" data-act="detail">详情/编辑</button>' : ""}
            ${p.draft ? "" : '<button class="ghost" data-act="upload">上传到B站</button>'}
          </div>
          <div class="detail" id="d-${pid(p.name)}"></div>
        </div>
      </div>`).join("");
  } catch (e) { $("projects").innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}

$("projects").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const name = btn.closest("[data-name]").dataset.name;
  if (btn.dataset.act === "detail") toggleDetail(name);
  else if (btn.dataset.act === "upload") upload(name, btn);
  else if (btn.dataset.act === "save") saveMeta(name, btn);
  else if (btn.dataset.act === "save-script") saveScript(name, btn, false);
  else if (btn.dataset.act === "regen") saveScript(name, btn, true);
});

async function toggleDetail(name) {
  const k = pid(name);
  const el = $("d-" + k);
  if (el.classList.contains("open")) { el.classList.remove("open"); return; }
  const p = await api("/api/projects/" + encodeURIComponent(name));
  const script = await api(`/api/projects/${encodeURIComponent(name)}/script`);
  const m = p.meta || {title: "", desc: "", tags: []};
  const metaHtml = p.draft ? "" : `
    <video controls src="${esc(p.video_url)}"></video>
    <div style="margin-top:10px"><label class="sub">B站标题</label>
      <input class="w100" id="t-${k}"></div>
    <div style="margin-top:8px"><label class="sub">简介</label>
      <textarea id="desc-${k}"></textarea></div>
    <div style="margin-top:8px"><label class="sub">标签(逗号分隔)</label>
      <input class="w100" id="tags-${k}"></div>
    <div class="row" style="margin-top:8px">
      <button data-act="save">保存元数据</button>
      <span class="msg" id="m-${k}"></span></div>`;
  el.innerHTML = metaHtml + `
    <div style="margin-top:14px"><label class="sub">脚本 script.json(改完保存; 重新生成会复用未改动场景的配音缓存)</label>
      <textarea class="code" id="s-${k}" spellcheck="false"></textarea></div>
    <label class="sub"><input type="checkbox" id="ov-${k}"> 覆盖设置: 用上方「生成视频」里选的配音/音色/画幅(不勾则沿用该作品上次的设置)</label>
    <div class="row" style="margin-top:8px">
      <button class="ghost" data-act="save-script">保存脚本</button>
      <button data-act="regen">保存并重新生成</button>
      <span class="msg" id="sm-${k}"></span></div>`;
  if (!p.draft) {
    $("t-" + k).value = m.title || "";
    $("desc-" + k).value = m.desc || "";
    $("tags-" + k).value = (m.tags || []).join(",");
  }
  $("s-" + k).value = JSON.stringify(script, null, 2);
  el.classList.add("open");
}

async function saveMeta(name, btn) {
  const k = pid(name);
  btn.disabled = true;
  try {
    await api(`/api/projects/${encodeURIComponent(name)}/meta`, {method: "PUT", body: {
      title: $("t-" + k).value,
      desc: $("desc-" + k).value,
      tags: $("tags-" + k).value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    }});
    msg("m-" + k, "已保存", "ok");
  } catch (e) { msg("m-" + k, e.message, "err"); }
  btn.disabled = false;
}

async function saveScript(name, btn, regen) {
  const k = pid(name);
  let body;
  try { body = JSON.parse($("s-" + k).value); }
  catch (e) { msg("sm-" + k, "JSON 语法错误: " + e.message, "err"); return; }
  btn.disabled = true;
  try {
    const base = `/api/projects/${encodeURIComponent(name)}`;
    await api(base + "/script", {method: "PUT", body});
    if (regen) {
      const d = await api(base + "/regenerate", {method: "POST",
        body: overrideBody($("ov-" + k).checked)});
      msg("sm-" + k, "已保存, 重新生成中(进度见上方「生成视频」)", "ok");
      msg("gen-msg", ""); $("btn-gen").disabled = true;
      pollJob(d.job_id);
    } else msg("sm-" + k, "脚本已保存", "ok");
  } catch (e) {
    msg("sm-" + k, e.message, "err");
    if (e.jobId) attachJob(e.jobId);
  }
  btn.disabled = false;
}

async function upload(name, btn) {
  if (!confirm(`确认把 ${name} 上传到B站?\n发布后请到创作中心补勾"AI生成"标识。`)) return;
  const at = prompt("定时发布(可选): 填本地时间 YYYY-mm-dd HH:MM(2 小时后~15 天内), 留空立即发布", "");
  if (at === null) return;
  btn.disabled = true;
  const post = force => api(`/api/projects/${encodeURIComponent(name)}/upload`,
    {method: "POST", body: {force, publish_at: at.trim() || null}});
  try {
    let d;
    try { d = await post(false); }
    catch (e) {
      if (!e.alreadyUploaded) throw e;
      if (!confirm(`${e.message}\n\n仍要重新投稿一份吗?`)) { btn.disabled = false; return; }
      d = await post(true);
    }
    alert("上传成功: " + d.url + (d.dtime ? "\n定时发布: " + new Date(d.dtime * 1000).toLocaleString() : ""));
    loadProjects();
  } catch (e) { alert("上传失败: " + e.message); }
  btn.disabled = false;
}

$("btn-refresh").onclick = loadProjects;
init();
</script>
</body>
</html>
