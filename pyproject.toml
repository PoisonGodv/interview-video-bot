[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-video-bot"
version = "0.1.0"
description = "AI 面试求职短视频流水线: LangChain 选题/脚本 → edge-tts 配音 → Playwright 渲染 → ffmpeg 合成 → B站发布"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "edge-tts>=7.0",
  "jinja2>=3.1",
  "playwright>=1.45",
  "Pillow>=10.0",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "bilibili-api-python>=16.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ivb = "interview_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interview_video = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
